<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="World Monitor on OpenShift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#12253d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#12253d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ee0000"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- latitude/longitude graticule, right side, evoking the globe -->
  <g stroke="#1c3350" stroke-width="1" fill="none" opacity="0.55" filter="url(#soft)">
    <circle cx="945" cy="160" r="150"/>
    <ellipse cx="945" cy="160" rx="55" ry="150"/>
    <ellipse cx="945" cy="160" rx="105" ry="150"/>
    <ellipse cx="945" cy="160" rx="150" ry="55"/>
    <ellipse cx="945" cy="160" rx="150" ry="105"/>
    <line x1="795" y1="160" x2="1095" y2="160"/>
    <line x1="945" y1="10" x2="945" y2="310"/>
  </g>

  <!-- scattered signal nodes -->
  <g fill="#2dd4bf" opacity="0.9">
    <circle cx="905" cy="120" r="3"/><circle cx="990" cy="145" r="2.5"/>
    <circle cx="945" cy="205" r="3.5"/><circle cx="1010" cy="195" r="2"/>
    <circle cx="880" cy="185" r="2"/>
  </g>
  <g fill="#ee0000" opacity="0.95">
    <circle cx="965" cy="110" r="4"/><circle cx="915" cy="215" r="3"/>
  </g>
  <g fill="#f59e0b" opacity="0.9">
    <circle cx="1005" cy="130" r="2.5"/><circle cx="895" cy="150" r="2.5"/>
  </g>

  <!-- red accent bar -->
  <rect x="80" y="96" width="6" height="128" rx="3" fill="url(#red)"/>

  <!-- wordmark -->
  <text x="112" y="142" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">World Monitor</text>
  <text x="112" y="188" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#ee0000" letter-spacing="0.5">on OpenShift</text>

  <!-- tagline -->
  <text x="112" y="228" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#7d93ad" letter-spacing="0.3">Real-time global intelligence · rebuilt on Red Hat UBI 10 · scanned, signed, self-hosted</text>

  <!-- tech chips -->
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#9db4cc">
    <rect x="112" y="250" width="86" height="26" rx="13" fill="#111b28" stroke="#22384f"/>
    <text x="155" y="267" text-anchor="middle">UBI 10</text>
    <rect x="206" y="250" width="104" height="26" rx="13" fill="#111b28" stroke="#22384f"/>
    <text x="258" y="267" text-anchor="middle">OpenShift</text>
    <rect x="318" y="250" width="112" height="26" rx="13" fill="#111b28" stroke="#22384f"/>
    <text x="374" y="267" text-anchor="middle">multi-arch</text>
    <rect x="438" y="250" width="92" height="26" rx="13" fill="#111b28" stroke="#22384f"/>
    <text x="484" y="267" text-anchor="middle">SBOM</text>
  </g>
</svg>
