name: upstream-sync

# Upstream's last release tag is ~5 months old while commits continue daily —
# they ship from main and stopped tagging. So there is no stable tag to track:
# v2.5.23 is a stale marker, not a release you would choose over main.
#
# This pins to a tested commit SHA and proposes bumps as PRs, rather than
# either chasing a moving main (nightly breakage from someone else's WIP) or
# freezing on a five-month-old tag (no fixes, growing CVE drift).

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          set -euo pipefail
          . ./upstream.env
          CURRENT="${UPSTREAM_SHA}"
          LATEST="$(git ls-remote https://github.com/koala73/worldmonitor.git \
                      "${UPSTREAM_REF:-main}" | cut -f1)"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}"   >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already current at ${CURRENT:0:7}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bump ${CURRENT:0:7} -> ${LATEST:0:7}"
          fi

      - name: Summarize upstream changes
        if: steps.check.outputs.changed == 'true'
        id: diff
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/koala73/worldmonitor.git up
          cd up
          git fetch --depth=200 origin "${{ steps.check.outputs.latest }}" 2>/dev/null || true
          # Flag changes to files this image's build depends on — those are the
          # ones that break a rebuild.
          {
            echo "### Commits"
            git log --oneline --no-decorate \
              "${{ steps.check.outputs.current }}..${{ steps.check.outputs.latest }}" \
              2>/dev/null | head -40 || echo "(shallow clone — range unavailable)"
            echo
            echo "### Build-relevant files touched"
            git diff --name-only \
              "${{ steps.check.outputs.current }}..${{ steps.check.outputs.latest }}" \
              2>/dev/null \
              | grep -E '^(package(-lock)?\.json|\.nvmrc|docker/|vite\.config\.ts|tsconfig)' \
              | head -20 || echo "(none)"
          } > ../notes.md
          cd ..
          {
            echo 'notes<<NOTES'
            cat notes.md
            echo 'NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BR="upstream-bump-${{ steps.check.outputs.latest }}"
          BR="${BR:0:40}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          sed -i "s|^UPSTREAM_SHA=.*|UPSTREAM_SHA=${{ steps.check.outputs.latest }}|" upstream.env
          git add upstream.env
          git commit -m "chore: bump upstream to ${{ steps.check.outputs.latest }}"
          git push -u origin "$BR"
          {
            echo "Automated upstream pin bump."
            echo
            echo "**Do not merge on green alone.** A passing build means the image"
            echo "compiles and the smoke test serves a page. It does not mean upstream"
            echo "has not changed behavior that matters here. Pay particular attention"
            echo "to changes under \`docker/\` (nginx.conf, entrypoint, build-handlers)"
            echo "since this image consumes those files directly."
            echo
            printf '%s\n' "${NOTES}"
          } > body.md
          gh pr create \
            --title "chore: bump upstream to ${{ steps.check.outputs.latest }}" \
            --body-file body.md \
            --label upstream-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.diff.outputs.notes }}
