---
# Redis REST proxy — the Upstash-compatible facade the app expects.
#
# This used to run docker.io/hiett/serverless-redis-http, which implements only
# the POST command forms of the Upstash REST API (POST /, /pipeline,
# /multi-exec). The app's readCachedJson() reads via path-style GET
# (GET /get/<key>), which hiett's SRH answers with 404 "Endpoint not found".
# The API handlers swallow that as a cache miss and return an empty result, so
# affected panels rendered "Temporarily unavailable" with no error surfaced
# anywhere in the app logs — only a bare `[redis] getCachedJson failed: Redis
# HTTP 404` with no key name.
#
# Upstream ships docker/redis-rest-proxy.mjs, which handles GET /{cmd}/{args},
# POST /, POST /pipeline and POST /multi-exec — the full set the app uses.
# containers/Containerfile.redis-rest rebuilds it on UBI 10 (upstream's
# Dockerfile.redis-rest uses node:24-alpine and runs as root, which restricted
# SCC rejects). Built and pushed by .github/workflows/build.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-rest
  labels:
    app.kubernetes.io/name: redis-rest
    app.kubernetes.io/component: cache-proxy
    app.kubernetes.io/part-of: worldmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-rest
        app.kubernetes.io/component: cache-proxy
        app.kubernetes.io/part-of: worldmonitor
    spec:
      containers:
        - name: srh
          image: quay.io/ryan_nix/worldmonitor-openshift:redis-rest-latest
          # A moving tag needs an explicit pull policy: the default for a
          # non-:latest-suffixed tag is IfNotPresent, and even with :latest a
          # cached layer on the node would silently pin an old build.
          imagePullPolicy: Always
          env:
            # Upstream's proxy reads PORT (default 80). A non-root arbitrary
            # UID cannot bind a privileged port, so move it to 8080 to match
            # the Service's targetPort. SRH_MODE and SRH_PORT were hiett-only
            # and are ignored here.
            - name: PORT
              value: "8080"
            - name: SRH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-redis
                  key: REDIS_TOKEN
            - name: SRH_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-redis
                  key: SRH_CONNECTION_STRING
          ports:
            - name: http
              containerPort: 8080
          # tcpSocket rather than httpGet: the proxy's GET / welcome route sits
          # behind the same bearer-token check as every other path, and a probe
          # cannot present the token without duplicating the Secret here.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: redis-rest
  labels:
    app.kubernetes.io/name: redis-rest
    app.kubernetes.io/part-of: worldmonitor
spec:
  selector:
    app.kubernetes.io/name: redis-rest
  ports:
    - name: http
      port: 80
      targetPort: http
