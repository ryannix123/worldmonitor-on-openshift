---
# Serverless Redis HTTP — the Upstash-compatible REST facade the app expects.
# Upstream builds this from docker/Dockerfile.redis-rest; the upstream SRH
# image is used directly here so the cluster doesn't need a second BuildConfig.
# If your docker/Dockerfile.redis-rest pins something different, swap the image
# and add a matching BuildConfig.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-rest
  labels:
    app.kubernetes.io/name: redis-rest
    app.kubernetes.io/component: cache-proxy
    app.kubernetes.io/part-of: worldmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-rest
        app.kubernetes.io/component: cache-proxy
        app.kubernetes.io/part-of: worldmonitor
    spec:
      containers:
        - name: srh
          image: docker.io/hiett/serverless-redis-http:latest
          env:
            - name: SRH_MODE
              value: "env"
            # SRH defaults to port 80, which OpenShift's restricted-v2 SCC
            # forbids an arbitrary UID from binding (listen() → eacces, and the
            # Erlang VM crashes at boot before it ever contacts Redis). Move it
            # to an unprivileged port.
            - name: SRH_PORT
              value: "8080"
            - name: SRH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-redis
                  key: REDIS_TOKEN
            - name: SRH_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-redis
                  key: SRH_CONNECTION_STRING
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: redis-rest
  labels:
    app.kubernetes.io/name: redis-rest
    app.kubernetes.io/part-of: worldmonitor
spec:
  selector:
    app.kubernetes.io/name: redis-rest
  ports:
    - name: http
      port: 80
      targetPort: http
