# =============================================================================
# World Monitor — Podman overlay for Apple Silicon (M-series)
# =============================================================================
# Use alongside the upstream docker-compose.yml:
#
#   podman compose -f docker-compose.yml -f podman/compose.arm64.yml up -d --build
#
# Two differences from the upstream compose on a Mac:
#
#  1. GPU. The Podman machine is a Linux VM with no Metal passthrough, so
#     Ollama runs NATIVELY on macOS (brew install ollama) and the container
#     reaches it at host.containers.internal. That is Podman's equivalent of
#     Docker's host.docker.internal and it resolves without extra config.
#
#  2. SELinux volume labels. Harmless on macOS, required if you ever run this
#     same file on your RHEL boxes, so the :Z suffix is set here rather than
#     maintained as a separate variant.
# =============================================================================

services:

  worldmonitor:
    build:
      dockerfile: Containerfile.ocp
    platform: linux/arm64
    environment:
      # Native macOS Ollama. Start it with: ollama serve
      LLM_API_URL: "http://host.containers.internal:11434/v1"
      LLM_MODEL: "${LLM_MODEL:-llama3.2:3b}"
      OLLAMA_API_URL: "http://host.containers.internal:11434"
      OLLAMA_MODEL: "${LLM_MODEL:-llama3.2:3b}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
    extra_hosts:
      - "host.containers.internal:host-gateway"

  ais-relay:
    platform: linux/arm64

  redis:
    platform: linux/arm64
    volumes:
      - redis-data:/data:Z

  redis-rest:
    platform: linux/arm64

volumes:
  redis-data:
