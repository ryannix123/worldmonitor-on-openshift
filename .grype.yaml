# Grype scan policy. Fails the build on Critical (--fail-on critical).
#
# CVE-2026-59873 / GHSA-23hp-3jrh-7fpw — node-tar decompression/parse DoS.
# not_affected: the relay is a network gateway (AIS/OpenSky/Telegram/RSS) that
# never extracts tar archives, so the vulnerable code path is unreachable. tar
# is a transitive build dep only. Full assessment: containers/relay.openvex.json.
#
# UNCONDITIONAL ignore (bare ID), not a vex-status rule: a vex-status rule only
# fires when a matching --vex document is also loaded, which this pipeline does
# not do, so it would be inert. A plain-ID ignore suppresses the match outright.
ignore:
  - vulnerability: CVE-2026-59873
  - vulnerability: GHSA-23hp-3jrh-7fpw
