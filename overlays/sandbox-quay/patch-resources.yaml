---
# Same Sandbox resource envelope as the build-based overlay, minus everything
# related to in-cluster building. See ../sandbox/patch-resources.yaml for the
# rationale on each number.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
spec:
  template:
    spec:
      containers:
        - name: worldmonitor
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - allkeys-lru
            - --dir
            - /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 160Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-rest
spec:
  template:
    spec:
      containers:
        - name: srh
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 160Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais-relay
spec:
  # Was 0 to save Sandbox memory. With the roomier quota (30Gi requests, not
  # 7Gi) there is no reason to keep it down — running it unlocks the maritime,
  # Hormuz, and chokepoint-rate panels. It inherits AISSTREAM_API_KEY,
  # ACLED_EMAIL, and ACLED_PASSWORD from the worldmonitor-apikeys secret via the
  # base's envFrom, so no env plumbing is added here.
  #
  # IMPORTANT: the relay hard-exits without AISSTREAM_API_KEY. Deploy the key
  # (./deploy.sh -e AISSTREAM_API_KEY=...) before or with this, or the pod
  # CrashLoopBackOffs. That is a missing-config failure, not a broken image.
  replicas: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  resources:
    requests:
      storage: 1Gi
