apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field. The overlay deploys into whatever namespace `oc` is
# currently pointed at, which in Sandbox is your assigned ryan-nix-dev.

resources:
  - ../../base
  - ../../addons/builds

patches:
  - path: patch-resources.yaml
  - path: patch-builds.yaml
  - path: patch-llm-openrouter.yaml

  # Sandbox applies its own NetworkPolicies at the namespace level, and the
  # platform's router-namespace labels differ from a self-managed cluster's.
  # Ours would be redundant at best and would silently blackhole the Route at
  # worst, so they are removed rather than debugged.
  - target:
      kind: NetworkPolicy
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: placeholder

secretGenerator:
  - name: worldmonitor-redis
    envs:
      - secrets/redis.env
  - name: worldmonitor-relay
    envs:
      - secrets/relay.env
  - name: worldmonitor-apikeys
    envs:
      - secrets/apikeys.env

generatorOptions:
  disableNameSuffixHash: true
